# Il sito Next.js sta nella sottocartella web/ ed è esportato come sito statico.
# base = web  -> Netlify entra in web/ per installare ed eseguire la build
# publish = out -> pubblica web/out (percorso relativo a base)
[build]
  base = "web"
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "18"
