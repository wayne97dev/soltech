# Postgres per la produzione. In sviluppo locale il backend usa SQLite (zero setup).
# Avvio: docker compose up -d
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: soltech
      POSTGRES_PASSWORD: soltech
      POSTGRES_DB: soltech
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
